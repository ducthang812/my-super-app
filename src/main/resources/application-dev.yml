server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: 123456

  jpa:
    hibernate:
      ddl-auto: validate

      properties:
        hibernate:
          format_sql: true
  flyway:
    enabled: true

jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-env}
  expiration-ms: 3600000 #1h
